[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "zemaxmcp"
version = "0.1.0"
description = "An MCP server for Ansys Zemax OpticStudio."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.3.0",
]

[project.scripts]
zemaxmcp = "zemaxmcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
default-groups = "all"
package = true
